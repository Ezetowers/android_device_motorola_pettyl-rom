# Version: 14.0 - Logs Pro + Pre-Release System + Swap 3GB
name: Build LineageOS 17.1 (Pettyl) - Debug & Logs

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar ROM
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del repositorio actual
        uses: actions/checkout@v4

      - name: Configurar 3GB de Swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 3

      - name: Limpieza BRUTAL de espacio en disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false 
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          
      - name: Instalar repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo cp ~/bin/repo /usr/local/bin/repo

      - name: Sincronizar LineageOS
        run: |
          mkdir -p /home/runner/android/lineage
          cd /home/runner/android/lineage
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Actions Bot"
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --quiet

      - name: Clonar y organizar repositorios
        run: |
          cd /home/runner/android/lineage
          git clone https://github.com/elmendezz/android_device_motorola_pettyl-rom -b lineage-17.1 /tmp/pettyl_unified
          mkdir -p device/motorola/pettyl vendor/motorola/pettyl
          cp -r /tmp/pettyl_unified/pettyl/* device/motorola/pettyl/
          cp -r /tmp/pettyl_unified/vendor_pettyl/* vendor/motorola/pettyl/
          rm -rf /tmp/pettyl_unified

      - name: TRUCO Eliminar .repo
        run: rm -rf /home/runner/android/lineage/.repo

      - name: Restaurar Ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-pettyl-${{ github.sha }}
          restore-keys: ccache-pettyl-

      - name: Compilar LineageOS
        id: build_step
        continue-on-error: true
        run: |
          cd /home/runner/android/lineage
          export USE_CCACHE=1
          export CCACHE_DIR=/home/runner/.ccache
          export _JAVA_OPTIONS="-Xmx6g"
          source build/envsetup.sh
          lunch lineage_pettyl-userdebug
          
          # Compilación con -j2 para estabilidad
          mka bacon systemimage -j8 2>&1 | tee build_log.txt
          
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "STATUS=successfully compiled" >> $GITHUB_ENV
          else
            echo "STATUS=failed" >> $GITHUB_ENV
            exit 1
          fi

      # --- GENERACIÓN DE METADATOS PARA EL LOG ---
      - name: Preparar Reporte de Logs
        if: always()
        run: |
          cd /home/runner/android/lineage
          echo "### REPORTE DE COMPILACIÓN ###" > final_report.md
          echo "**Estado:** ${{ env.STATUS || 'failed' }}" >> final_report.md
          echo "**Fecha:** $(date +'%d/%m/%Y %H:%M')" >> final_report.md
          echo "" >> final_report.md
          
          echo "#### PESO DE ARCHIVOS GENERADOS ####" >> final_report.md
          if [ -d out/target/product/pettyl ]; then
            ls -lh out/target/product/pettyl/*.img 2>/dev/null >> final_report.md || echo "No hay archivos .img" >> final_report.md
          fi
          echo "" >> final_report.md
          
          echo "#### ÚLTIMOS 30 CAMBIOS (DEVICE/VENDOR) ####" >> final_report.md
          cd device/motorola/pettyl && echo "--- Device Tree ---" >> ../../../final_report.md && git log -n 15 --oneline >> ../../../final_report.md
          cd ../../../vendor/motorola/pettyl && echo "--- Vendor Tree ---" >> ../../final_report.md && git log -n 15 --oneline >> ../../final_report.md
          
          # Guardar variables para el release
          echo "RELEASE_TAG=$(date +'%d-%m-%Y')-$(date +'%H%M')-run${{ github.run_number }}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=Logs $(date +'%d/%m/%Y') #${{ github.run_number }} (${{ env.STATUS || 'failed' }})" >> $GITHUB_ENV

      - name: 1. Subir Log como Artefacto (Persistencia 90 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Full-Build-Logs
          path: /home/runner/android/lineage/build_log.txt
          retention-days: 90

      - name: 2. Crear Pre-Release con Logs
        if: always()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: /home/runner/android/lineage/final_report.md
          files: /home/runner/android/lineage/build_log.txt
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Subir Imágenes (Solo si compiló con éxito)
        if: env.STATUS == 'successfully compiled'
        uses: actions/upload-artifact@v4
        with:
          name: Pettyl-Images
          path: |
            /home/runner/android/lineage/out/target/product/pettyl/system.img
            /home/runner/android/lineage/out/target/product/pettyl/boot.img
            /home/runner/android/lineage/out/target/product/pettyl/recovery.img
          retention-days: 7
