# Version: 8.1
# Changelog:
# - Se eliminó el "Anti-Rojo" para dejar que GitHub muestre los errores reales.
# - Se añadió un registro de logs (build_log.txt).
# - Se configuró la subida de artefactos para que rescate imágenes y logs INCLUSO SI FALLA.
# - NUEVO: Se integró el envío de Live Logs a Render conservando el volcado a build_log.txt.

name: Build LineageOS 17.1 for pettyl - logs

on:
  workflow_dispatch:

env:
  # Variable global para los Live Logs
  WEBHOOK_URL: "https://render-gci-terminalonline.onrender.com/auth/terminalonly"

jobs:
  build:
    name: Compilar ROM
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del repositorio actual
        uses: actions/checkout@v4

      - name: Limpieza BRUTAL de espacio en disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Purgar paquetes innecesarios manualmente
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d/*
          sudo docker system prune -af

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          # Nota: Se agregó 'jq' para formatear los logs de forma segura
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick jq lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Instalar repo
        run: |
          mkdir -p /home/runner/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > /home/runner/bin/repo
          chmod a+x /home/runner/bin/repo
          sudo cp /home/runner/bin/repo /usr/local/bin/repo

      - name: Configurar Git
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Actions Bot"

      - name: Sincronizar LineageOS (Con Live Logs)
        run: |
          mkdir -p /home/runner/android/lineage
          cd /home/runner/android/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          
          # Desactivamos el fallo inmediato por pipe para poder capturar el error original
          set +e +o pipefail
          
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --quiet 2>&1 | while IFS= read -r line; do
            PAYLOAD=$(jq -n --arg log "$line" '{log: $log}')
            curl -s -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "${{ env.WEBHOOK_URL }}/${{ github.run_id }}" > /dev/null || true
            echo "$line"
          done
          
          # PIPESTATUS[0] guarda el código de salida de 'repo sync'
          SYNC_STATUS=${PIPESTATUS[0]}
          set -e -o pipefail
          
          # Si repo sync falló, forzamos el error para que GitHub Actions se ponga rojo
          if [ $SYNC_STATUS -ne 0 ]; then
            echo "⚠️ ERROR: El repo sync falló."
            exit $SYNC_STATUS
          fi

      - name: Clonar y organizar repositorios de pettyl y vendor
        run: |
          cd /home/runner/android/lineage
          git clone https://github.com/elmendezz/android_device_motorola_pettyl-rom -b lineage-17.1 /tmp/pettyl_unified
          mkdir -p device/motorola/pettyl
          mkdir -p vendor/motorola/pettyl
          cp -r /tmp/pettyl_unified/pettyl/* device/motorola/pettyl/
          cp -r /tmp/pettyl_unified/vendor_pettyl/* vendor/motorola/pettyl/
          rm -rf /tmp/pettyl_unified

      - name: TRUCO Eliminar repo oculto para liberar espacio vital
        run: |
          echo "Eliminando la carpeta .repo para recuperar espacio..."
          rm -rf /home/runner/android/lineage/.repo
          df -h

      - name: Compilar LineageOS (Con Live Logs y Guardado Local)
        run: |
          cd /home/runner/android/lineage
          export USE_CCACHE=0
          export CCACHE_DISABLE=1
          source build/envsetup.sh
          lunch lineage_pettyl-userdebug
          
          set +e +o pipefail
          
          # Guardamos en build_log.txt CON tee Y mandamos a Render al mismo tiempo
          mka bacon -j$(nproc --all) 2>&1 | tee build_log.txt | while IFS= read -r line; do
            PAYLOAD=$(jq -n --arg log "$line" '{log: $log}')
            curl -s -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "${{ env.WEBHOOK_URL }}/${{ github.run_id }}" > /dev/null || true
            # No usamos echo aquí porque 'tee' ya imprime en la consola de GitHub Actions
          done
          
          # PIPESTATUS[0] sigue capturando el éxito o fracaso de 'mka bacon'
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e -o pipefail
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "⚠️ ERROR: La compilación falló."
            exit $BUILD_STATUS
          fi

      - name: Rescatar Logs e Imágenes (Se ejecuta aunque falle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Archivos-Rescatados-Pettyl
          path: |
            /home/runner/android/lineage/build_log.txt
            /home/runner/android/lineage/out/target/product/pettyl/*.img
            /home/runner/android/lineage/out/target/product/pettyl/*.zip
          retention-days: 5

      - name: Preparar fecha para la Release
        run: echo "FECHA=$(date +'%Y%m%d_%H%M')" >> $GITHUB_ENV

      - name: Crear Release y Subir ROM a GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: LOS-17.1-${{ env.FECHA }}
          name: "LineageOS 17.1 - Moto E5 Play (pettyl) 🚀"
          body: |
            ### Compilación Automática
            - **Dispositivo:** Motorola Moto E5 Play (pettyl)
            - **Android:** 10 (LineageOS 17.1)
            - **Fecha:** ${{ env.FECHA }}
          files: /home/runner/android/lineage/out/target/product/pettyl/lineage-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
