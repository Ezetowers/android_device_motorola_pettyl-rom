# Version: 10 - Optimized for pettyl Recovery
# Changelog:
# - Fusion de dependencias Ubuntu 22.04 (v5) con lógica de limpieza pettyl (v9).
# - Objetivo cambiado de 'bacon' (ROM completa) a 'recoveryimage' para ahorrar tiempo y espacio.
# - Mantiene la creación de Issue en caso de fallo y rescate de logs.

name: Build Recovery LineageOS 17.1 - pettyl

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar Recovery
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximizar espacio en disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          large-packages: true
          docker-images: true

      - name: Instalar dependencias (Fix Ubuntu 22.04)
        run: |
          sudo dpkg --add-architecture i386
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libncurses5:i386 libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync micro schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 \
            libstdc++6:i386 libncurses6:i386

      - name: Instalar Herramienta Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/local/bin/repo

      - name: Configurar Git
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Actions Bot"
          git config --global color.ui false

      - name: Sincronizar Fuentes (LineageOS 17.1)
        run: |
          mkdir -p android/lineage
          cd android/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags --quiet

      - name: Clonar Árbol de Dispositivo (pettyl)
        run: |
          cd android/lineage
          # Clonamos el repo unificado en temporal
          git clone https://github.com/elmendezz/android_device_motorola_pettyl-rom -b lineage-17.1 /tmp/pettyl_unified
          
          # Estructura correcta para Lineage
          mkdir -p device/motorola/pettyl
          mkdir -p vendor/motorola/pettyl
          
          # Mover archivos desde el repo unificado
          cp -r /tmp/pettyl_unified/pettyl/* device/motorola/pettyl/
          cp -r /tmp/pettyl_unified/vendor_pettyl/* vendor/motorola/pettyl/
          rm -rf /tmp/pettyl_unified

      - name: Liberar espacio (.repo)
        run: rm -rf android/lineage/.repo

      - name: Compilar Recovery Image
        run: |
          cd android/lineage
          export USE_CCACHE=0
          source build/envsetup.sh
          lunch lineage_pettyl-userdebug
          
          # Compilar específicamente el recovery
          mka recoveryimage -j$(nproc) 2>&1 | tee build_log.txt

      - name: Subir Resultados (Logs e Imágenes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Recovery-Pettyl-Output
          path: |
            android/lineage/build_log.txt
            android/lineage/out/target/product/pettyl/recovery.img
          retention-days: 5

      - name: Reportar error en Issue
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -n 200 android/lineage/build_log.txt > error_snippet.txt
          
          cat << 'EOF' > issue_body.md
          ## 🚨 Error en Compilación de Recovery (pettyl)
          La build falló. Revisa los artefactos para el log completo.
          
          ### Últimas líneas:
          ```text
          EOF
          cat error_snippet.txt >> issue_body.md
          echo '```' >> issue_body.md
          
          gh issue create \
            --title "Build Failed: $(date +'%Y-%m-%d %H:%M')" \
            --body-file issue_body.md
