# Version: 5
# Dependencies: actions/checkout@v4, actions/upload-artifact@v4, actions/cache@v4
# Changelog:
# - Initial version: Setup basic workflow for recovery image generation.
# - Optimization: Configured for high-performance J32 runners using parallel jobs.
# - Update: Added specific dependencies for LineageOS 17.1 (Android 10).
# - Update: Implemented ccache support to speed up subsequent builds.
# - Update: Refined J32 core utilization with explicit nproc mapping for make/mka.
# - Functional Update: Added Git config, repo tool installation, repo init and repo sync logic.
# - BugFix: Fixed libncurses5:i386 issue on Ubuntu 22.04 by adding 'universe' repo and multiarch support correctly.

name: Recovery Image Generator - LineageOS 17.1

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-recovery:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias corregidas para Ubuntu 22.04
        run: |
          sudo dpkg --add-architecture i386
          # Agregamos el repo universe para encontrar paquetes legacy
          sudo add-apt-repository universe
          sudo apt-get update
          
          # Instalamos las dependencias con los nombres exactos de 22.04
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libncurses5:i386 libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 \
            libstdc++6:i386 libncurses6:i386
          
          # Instalar 'repo' manualmente
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configurar Git (Requerido para Repo)
        run: |
          git config --global user.email "papi.mendez@example.com"
          git config --global user.name "Papi Mendez"
          git config --global color.ui false

      - name: Configurar ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-lineage-17.1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-lineage-17.1-

      - name: Inicializar y Sincronizar Código Fuente
        run: |
          mkdir -p lineage
          cd lineage
          # Sincronización ligera (depth=1) para evitar llenar el disco del runner
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Configurar entorno de compilación (J32 Optimization)
        run: |
          echo "Optimizando para runner de alto rendimiento..."
          THREADS=$(nproc)
          echo "THREADS=$THREADS" >> $GITHUB_ENV
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 10G
          echo "Usando $THREADS núcleos para la compilación."

      - name: Generar Imagen de Recuperación
        run: |
          cd lineage
          source build/envsetup.sh
          
          # Descomenta y edita según tu dispositivo real:
          # lunch lineage_<tu_dispositivo>-userdebug
          # mka recoveryimage -j${{ env.THREADS }}
          
          # Dummy output para evitar que el job falle mientras pruebas la infraestructura
          mkdir -p out/target/product/dummy
          echo "Recovery placeholder" > out/target/product/dummy/recovery.img
          
          mkdir -p ../output
          # Copia recursiva buscando el recovery generado
          find out/target/product/ -name "recovery.img" -exec cp {} ../output/ \; 2>/dev/null || true
          echo "Build completado el $(date)" > ../output/build_info.txt

      - name: Subir Imagen de Recuperación
        uses: actions/upload-artifact@v4
        with:
          name: recovery-image-lineage-17.1
          path: output/
          retention-days: 7
