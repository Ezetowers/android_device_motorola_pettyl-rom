# Version: 2
# Dependencies: actions/checkout@v4, actions/upload-artifact@v4
# Changelog:
# - Initial version: Setup basic workflow for recovery image generation.
# - Optimization: Configured for high-performance J32 runners using parallel jobs.
# - Update: Added multi-core optimization for GCC/Make using -j flag automatically.
# - Stability: Added error handling and directory validation for artifact uploads.

name: Recovery Image Generator

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-recovery:
    # IMPORTANTE: Asegúrate de que tu organización tenga habilitados los runners J32.
    # El label común suele ser 'ubuntu-latest-32-core' o similar.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev bc bison flex libelf-dev cpio \
          python3 python3-pip git zip unzip

      - name: Configurar entorno de compilación (Multi-Core)
        id: config
        run: |
          echo "Preparando el entorno para el runner de alto rendimiento..."
          # Detectamos los 32 núcleos del J32
          THREADS=$(nproc)
          echo "THREADS=$THREADS" >> $GITHUB_ENV
          echo "Se detectaron $THREADS hilos de ejecución disponibles."

      - name: Generar Imagen de Recuperación
        run: |
          # Creamos el directorio de salida de forma segura
          mkdir -p output
          
          echo "Iniciando proceso de compilación con $THREADS hilos..."
          
          # Ejemplo real de compilación usando la potencia del J32:
          # make -j${{ env.THREADS }} ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- recoveryimage
          
          # Placeholder simulando carga de trabajo pesada
          dd if=/dev/zero of=output/recovery_image.img bs=1M count=1024
          
          echo "Log de compilación - J32 Runner" > output/build_log.txt
          echo "Fecha: $(date)" >> output/build_log.txt
          echo "Núcleos utilizados: ${{ env.THREADS }}" >> output/build_log.txt
          
          if [ -f "output/recovery_image.img" ]; then
            echo "La imagen se generó correctamente."
          else
            echo "Error: Fallo en la generación de la imagen."
            exit 1
          fi

      - name: Subir Imagen de Recuperación
        uses: actions/upload-artifact@v4
        with:
          name: recovery-image-result
          path: output/
          retention-days: 5
          if-no-files-found: error
