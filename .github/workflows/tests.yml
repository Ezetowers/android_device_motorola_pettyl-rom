      - name: Simulador de Compilacion ROM (39 segundos)
        run: |
          python3 -c "
          import time
          import sys
          import random

          start_time = time.time()
          duration = 39
          total_steps = 5000

          print('Iniciando simulacion de compilacion...')

          while True:
              elapsed = time.time() - start_time
              if elapsed >= duration:
                  break
              
              # Calculamos un porcentaje ficticio basado en el tiempo
              percent = int((elapsed / duration) * 100)
              current_step = int((elapsed / duration) * total_steps)
              
              # Formato exacto de Android: [ 52% 1234/5000]
              # \r  -> Vuelve al inicio de la línea
              # \033[K -> Borra lo que había antes en esa línea
              sys.stdout.write(f'\r\033[K[ {percent:>2}% {current_step}/{total_steps}] Compilando modulo_{random.randint(1, 999)}.cpp')
              sys.stdout.flush()
              
              time.sleep(0.1) # Actualización rápida para notar el efecto

          print('\n\n[ 100% 5000/5000] Compilacion finalizada con exito.')
          "
