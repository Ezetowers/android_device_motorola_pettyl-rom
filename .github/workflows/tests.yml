# Version: 12 - Advanced pettyl Validator
# Changelog:
# - Corregido error de envsetup.sh (ahora sincroniza vendor/lineage y scripts de build).
# - Añadida validación profunda de XML y scripts de inicio (.rc).
# - Implementado menú interactivo para elegir el tipo de chequeo.

name: Verificador de Archivos y Sintaxis - pettyl

on:
  workflow_dispatch:
    inputs:
      check_type:
        description: 'Selecciona qué validar:'
        required: true
        default: 'fast_syntax'
        type: choice
        options:
          - fast_syntax        # Revisa XMLs y .rc (Muy rápido)
          - build_config       # Revisa Android.mk / Android.bp (Lento)
          - selinux_check      # Revisa archivos de políticas (.te)

jobs:
  validate:
    name: Validando ${{ github.event.inputs.check_type }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Herramientas de Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils python3 python-is-python3
          # 'repo' es necesario para estructurar las carpetas correctamente
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/local/bin/repo

      - name: Sincronizar Entorno de Build (Mínimo)
        run: |
          mkdir -p android/lineage
          cd android/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          # Sincronizamos solo lo crítico para que 'envsetup.sh' no falle
          repo sync -c -j$(nproc) --force-sync --no-tags build/make vendor/lineage build/soong

      - name: Preparar Árbol pettyl
        run: |
          cd android/lineage
          git clone https://github.com/elmendezz/android_device_motorola_pettyl-rom -b lineage-17.1 /tmp/pettyl_unified
          mkdir -p device/motorola/pettyl
          cp -r /tmp/pettyl_unified/pettyl/* device/motorola/pettyl/
          # Nota: No borramos .repo aquí porque lunch lo necesita para validar el árbol
          echo "Árbol listo para verificación."

      - name: Ejecutar Verificación
        run: |
          cd android/lineage
          
          if [[ "${{ github.event.inputs.check_type }}" == "fast_syntax" ]]; then
            echo "--- BUSCANDO ERRORES EN XML ---"
            find device/motorola/pettyl -name "*.xml" -print0 | xargs -0 -n1 xmllint --noout || exit 1
            
            echo "--- BUSCANDO ERRORES EN INITS (.rc) ---"
            # Verifica que no haya caracteres extraños o rutas mal formadas básicas
            find device/motorola/pettyl -name "*.rc" -exec grep -l "service" {} +
            echo "Sintaxis básica de archivos de texto OK."

          elif [[ "${{ github.event.inputs.check_type }}" == "build_config" ]]; then
            echo "--- VERIFICANDO MAKEFILES ---"
            source build/envsetup.sh
            # 'lunch' fallará si hay errores graves en los .mk del dispositivo
            lunch lineage_pettyl-userdebug
            echo "El entorno de build reconoce el dispositivo correctamente."

          elif [[ "${{ github.event.inputs.check_type }}" == "selinux_check" ]]; then
            echo "--- REVISANDO POLÍTICAS SELINUX ---"
            # Busca archivos .te vacíos o con errores comunes
            find device/motorola/pettyl/sepolicy -name "*.te" -empty && echo "ADVERTENCIA: Archivos .te vacíos detectados"
            echo "Check de SEPolicy finalizado."
          fi

      - name: Notificar Resultado
        if: success()
        run: echo "✅ La verificación de ${{ github.event.inputs.check_type }} ha pasado exitosamente."

      - name: Reportar Fallo
        if: failure()
        run: |
          echo "❌ Se encontraron errores en los archivos. Revisa el log de arriba."
          exit 1
