# Version: 11 - Smart File Validator (pettyl)
# Changelog:
# - Se añade menú de selección (XML, Inits, Recovery o System).
# - No compila la ROM completa; usa 'make' con targets específicos.
# - Ideal para check rápido de sintaxis en el árbol de dispositivo.

name: Verificador de Archivos y Sintaxis - pettyl

on:
  workflow_dispatch:
    inputs:
      check_type:
        description: '¿Qué quieres verificar?'
        required: true
        default: 'xml_init'
        type: choice
        options:
          - xml_init
          - recovery_check
          - system_check
          - kernel_dtb

jobs:
  validate:
    name: Validando ${{ github.event.inputs.check_type }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Herramientas de Validación
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils python3-pip
          # Instalamos una herramienta para validar archivos .rc (init)
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/local/bin/repo

      - name: Sincronizar Árbol (Solo Manifiesto)
        run: |
          mkdir -p android/lineage
          cd android/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          # Sincronizamos solo lo mínimo necesario para el entorno de build
          repo sync -c -j$(nproc) --force-sync --no-tags --quiet build/make

      - name: Clonar Árbol pettyl
        run: |
          cd android/lineage
          git clone https://github.com/elmendezz/android_device_motorola_pettyl-rom -b lineage-17.1 /tmp/pettyl_unified
          mkdir -p device/motorola/pettyl
          cp -r /tmp/pettyl_unified/pettyl/* device/motorola/pettyl/
          rm -rf /tmp/pettyl_unified

      - name: Ejecutar Verificación Seleccionada
        run: |
          cd android/lineage/device/motorola/pettyl
          
          if [[ "${{ github.event.inputs.check_type }}" == "xml_init" ]]; then
            echo "--- Verificando XMLs ---"
            find . -name "*.xml" -exec xmllint --noout {} + || exit 1
            echo "--- Verificando Scripts Init (.rc) ---"
            # Buscamos errores comunes de sintaxis en inits
            find . -name "*.rc" -exec grep -q "import" {} + && echo "Estructura básica OK"
            echo "Validación de archivos de configuración completada."
          
          elif [[ "${{ github.event.inputs.check_type }}" == "recovery_check" ]]; then
            echo "Simulando pre-compilación de Recovery..."
            cd ../../../
            source build/envsetup.sh
            lunch lineage_pettyl-userdebug
            # 'mmm' compila solo el directorio actual o módulos específicos
            make -j$(nproc) recoveryimage-nodeps
          
          elif [[ "${{ github.event.inputs.check_type }}" == "system_check" ]]; then
            echo "Verificando dependencias de System..."
            # Aquí podrías poner un check de selinux o de limpieza de archivos
            source ../../../build/envsetup.sh
            lunch lineage_pettyl-userdebug
            make -j$(nproc) checkbuild
          fi

      - name: Subir Log de Verificación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Resultado-Verificacion-${{ github.event.inputs.check_type }}
          path: |
            android/lineage/build_log.txt
            device/motorola/pettyl/
