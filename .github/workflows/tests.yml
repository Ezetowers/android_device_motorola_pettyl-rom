name: Compilación ROM - Simulador y Hardware

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check Hardware & Disk Space
        run: |
          echo "### 🚀 ESTADO DEL SISTEMA ###"
          echo "------------------------------------------"
          echo "💾 INFORMACIÓN DE DISCO:"
          df -h | grep -E '^Filesystem|/dev/sda1|/|tmpfs'
          echo ""
          echo "🧠 INFORMACIÓN DE RAM:"
          free -h
          echo "------------------------------------------"
          echo "🔥 NÚCLEOS DE CPU: $(nproc)"
          echo "------------------------------------------"

      - name: Simulador de Compilacion (39 Segundos)
        run: |
          python3 -c "
          import time
          import sys
          import random

          start_time = time.time()
          duration = 39
          total_steps = 5000

          print('Iniciando proceso de mka bacon...')

          while True:
              elapsed = time.time() - start_time
              if elapsed >= duration:
                  break
              
              percent = int((elapsed / duration) * 100)
              current_step = int((elapsed / duration) * total_steps)
              
              # Formato: [ 52% 1234/5000]
              # \r vuelve al inicio, \033[K borra la linea previa
              sys.stdout.write(f'\r\033[K[ {percent:>2}% {current_step}/{total_steps}] Building: target/product/rom/obj/KERNEL_OBJ/arch/arm64/boot/Image_{random.randint(1, 100)}.o')
              sys.stdout.flush()
              
              time.sleep(0.15) # Un poco más lento para que GitHub procese el buffer

          print('\n\n✅ [ 100% 5000/5000] Compilación finalizada con éxito.')
          "

      - name: Final Disk Status
        if: always()
        run: |
          echo "### 🏁 ESPACIO FINAL EN DISCO ###"
          df -h /
