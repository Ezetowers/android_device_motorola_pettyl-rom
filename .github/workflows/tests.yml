# Version: 13 - pettyl Structural Fix
# Changelog:
# - Se añade 'build/blueprint' y 'prebuilts/go' (necesarios para microfactory.bash).
# - Se corrige la ruta del dispositivo para que 'lunch' lo detecte.
# - Se añade validación automática de fstab.

name: Verificador de Archivos y Sintaxis - pettyl

on:
  workflow_dispatch:
    inputs:
      check_type:
        description: 'Selecciona qué validar:'
        required: true
        default: 'fast_syntax'
        type: choice
        options:
          - fast_syntax        # XML, Inits y FSTAB (Rápido)
          - build_config       # Lunch y Makefiles (Estructural)

jobs:
  validate:
    name: Validando ${{ github.event.inputs.check_type }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils python3 python-is-python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/local/bin/repo

      - name: Sincronizar Mínimo Vital (Fix Microfactory)
        run: |
          mkdir -p android/lineage
          cd android/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          # Añadimos build/blueprint y prebuilts/go para que microfactory no explote
          repo sync -c -j$(nproc) --force-sync --no-tags \
            build/make \
            build/soong \
            build/blueprint \
            vendor/lineage \
            prebuilts/go/linux-x86

      - name: Preparar Árbol pettyl
        run: |
          cd android/lineage
          # Es vital que la ruta sea device/motorola/pettyl
          mkdir -p device/motorola/pettyl
          git clone https://github.com/elmendezz/android_device_motorola_pettyl-rom -b lineage-17.1 /tmp/pettyl_unified
          
          # Copiamos el contenido. Ajustamos según la estructura de tu repo:
          if [ -d "/tmp/pettyl_unified/pettyl" ]; then
            cp -r /tmp/pettyl_unified/pettyl/* device/motorola/pettyl/
          else
            cp -r /tmp/pettyl_unified/* device/motorola/pettyl/
          fi
          rm -rf /tmp/pettyl_unified

      - name: Ejecutar Verificación
        run: |
          cd android/lineage
          
          if [[ "${{ github.event.inputs.check_type }}" == "fast_syntax" ]]; then
            echo "--- BUSCANDO ERRORES EN XML ---"
            find device/motorola/pettyl -name "*.xml" -print0 | xargs -0 -n1 xmllint --noout || exit 1
            
            echo "--- VERIFICANDO FSTAB ---"
            find device/motorola/pettyl -name "*fstab*" -exec grep -q "wait" {} + && echo "fstab parece válido"

            echo "--- BUSCANDO ERRORES EN INITS (.rc) ---"
            find device/motorola/pettyl -name "*.rc" -exec grep -l "service" {} +

          elif [[ "${{ github.event.inputs.check_type }}" == "build_config" ]]; then
            echo "--- VERIFICANDO LUNCH ---"
            # Forzamos a bash para evitar problemas con envsetup
            bash -c "source build/envsetup.sh && lunch lineage_pettyl-userdebug"
          fi

      - name: Reportar Fallo
        if: failure()
        run: |
          echo "❌ ERROR DETECTADO"
          echo "Si el error es 'Device not found', revisa que device/motorola/pettyl/lineage_pettyl.mk exista."
          exit 1
