# Version:3
# Changelog:
# - Versión 1: Creación del flujo de trabajo CI inicial para compilar LineageOS 17.1 para el dispositivo pettyl.
# - Versión 1: Integración de la acción 'maximize-build-space' para evitar errores de almacenamiento.
# - Versión 2: Actualización a ubuntu-22.04 y upload-artifact@v4 por depreciación.
# - Versión 3: Ajuste agresivo de limpieza de espacio para evitar "No space left on device".
# - Versión 3: Optimización de repo sync con --no-tags y --force-sync para reducir el tamaño del árbol de fuentes.
# - Versión 3: Eliminación de archivos innecesarios de Azure y paquetes sobrantes antes de iniciar el proceso.

name: Build LineageOS 17.1 for pettyl

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar ROM
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del repositorio actual
        uses: actions/checkout@v4

      - name: Limpieza agresiva de espacio en disco
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048 # Bajamos la reserva para darle más a la ROM
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true' # Borramos imágenes de Docker para ganar más GB

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Instalar repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo cp ~/bin/repo /usr/local/bin/repo

      - name: Configurar Git
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Actions Bot"

      - name: Sincronizar LineageOS (Modo ultra ligero)
        run: |
          mkdir -p ~/android/lineage
          cd ~/android/lineage
          # Agregamos --depth=1 y quitamos tags para ahorrar el máximo espacio posible
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --quiet

      - name: Clonar repositorios de pettyl
        run: |
          cd ~/android/lineage
          git clone https://github.com/elmendezz/android_device_motorola_pettyl-rom -b lineage-17.1 device/motorola/pettyl
          git clone https://github.com/elmendezz/vendor_pettyl -b lineage-17.1 vendor/motorola/pettyl

      - name: Compilar LineageOS
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          lunch lineage_pettyl-userdebug
          # mka bacon genera el ZIP flasheable
          mka bacon -j$(nproc --all)

      - name: Subir ROM
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-17.1-pettyl-Build
          path: ~/android/lineage/out/target/product/pettyl/lineage-*.zip
          retention-days: 7
