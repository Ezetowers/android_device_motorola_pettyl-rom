# Version: 10
# Changelog:
# - Se añadió soporte para Ccache con persistencia en el caché de GitHub.
# - Se configuró USE_CCACHE=1 y un límite de 2GB para no saturar el almacenamiento.
# - Se añadió el paso 'Restore Ccache' para recuperar progreso de builds anteriores.
# - Se eliminó el "Anti-Rojo" para dejar que GitHub muestre los errores reales.
# - Se añadió un registro de logs (build_log.txt).
# - Se configuró la subida de artefactos para que rescate imágenes y logs INCLUSO SI FALLA.
# - Se reemplazó la creación de Release por la generación automática de un Issue si la build falla.

name: Build LineageOS 17.1 for pettyl

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar ROM
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del repositorio actual
        uses: actions/checkout@v4

      - name: Limpieza BRUTAL de espacio en disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Purgar paquetes innecesarios manualmente
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d/*
          sudo docker system prune -af

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync bundle-config schedtool squashfs-tools xsltproc zip zlib1g-dev python2 python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Instalar repo
        run: |
          mkdir -p /home/runner/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > /home/runner/bin/repo
          chmod a+x /home/runner/bin/repo
          sudo cp /home/runner/bin/repo /usr/local/bin/repo

      - name: Configurar Git
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Actions Bot"

      - name: Sincronizar LineageOS
        run: |
          mkdir -p /home/runner/android/lineage
          cd /home/runner/android/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --quiet

      - name: Clonar y organizar repositorios de pettyl y vendor
        run: |
          cd /home/runner/android/lineage
          git clone https://github.com/elmendezz/android_device_motorola_pettyl-rom -b lineage-17.1 /tmp/pettyl_unified
          mkdir -p device/motorola/pettyl
          mkdir -p vendor/motorola/pettyl
          cp -r /tmp/pettyl_unified/pettyl/* device/motorola/pettyl/
          cp -r /tmp/pettyl_unified/vendor_pettyl/* vendor/motorola/pettyl/
          rm -rf /tmp/pettyl_unified

      - name: TRUCO Eliminar repo oculto para liberar espacio vital
        run: |
          echo "Eliminando la carpeta .repo para recuperar espacio..."
          rm -rf /home/runner/android/lineage/.repo
          df -h

      - name: Restaurar Ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Compilar LineageOS (Con Ccache habilitado)
        run: |
          cd /home/runner/android/lineage
          export USE_CCACHE=1
          export CCACHE_DIR=/home/runner/.ccache
          ccache -M 2G
          source build/envsetup.sh
          lunch lineage_pettyl-userdebug
          
          # El comando tee guarda un log de todo lo que sale en pantalla
          mka bacon -j$(nproc --all) | tee build_log.txt

      - name: Rescatar Logs e Imágenes (Se ejecuta aunque falle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Archivos-Rescatados-Pettyl
          path: |
            /home/runner/android/lineage/build_log.txt
            /home/runner/android/lineage/out/target/product/pettyl/*.img
            /home/runner/android/lineage/out/target/product/pettyl/*.zip
          retention-days: 5

      - name: Crear Issue si la compilación falla
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Generando reporte de error..."
          
          # Extraemos las últimas 200 líneas del log
          tail -n 200 /home/runner/android/lineage/build_log.txt > error_snippet.txt
          
          # Creamos el cuerpo del Issue usando formato Markdown
          cat << 'EOF' > issue_body.md
          ## 🚨 La compilación de LineageOS ha fallado
          
          La ejecución del workflow no pudo terminar la ROM. Revisa los artefactos subidos para descargar el archivo `build_log.txt` completo.
          
          ### Últimas 200 líneas del log:
          ```text
          EOF
          
          cat error_snippet.txt >> issue_body.md
          echo '```' >> issue_body.md
          
          # Generar una fecha para el título
          FECHA=$(date +'%Y-%m-%d %H:%M')
          
          # Crear el issue usando GitHub CLI
          gh issue create \
            --title "🚨 Build Failed: Release Cannot Be Created ($FECHA)" \
            --body-file issue_body.md
