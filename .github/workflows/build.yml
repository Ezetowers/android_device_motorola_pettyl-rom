# Version: 4
# Changelog:
# - Versión 4: Cambio a jlumbroso/free-disk-space para limpieza extrema ("Tipo Void Linux").
# - Versión 4: Se añade comprobación de disco (df -h) antes del repo init.
# - Versión 4: TRUCO EXTREMO - Eliminación de la carpeta .repo después de clonar para recuperar ~30GB.
# - Versión 4: Desactivación de CCACHE para evitar que los archivos cacheados saturen el disco.

name: Build LineageOS 17.1 for pettyl

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar ROM
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del repositorio actual
        uses: actions/checkout@v4

      - name: Limpieza BRUTAL de espacio en disco (Estilo Linux Void)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true # Borra el SDK preinstalado que no necesitamos para compilar la ROM
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Purgar paquetes innecesarios manualmente
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d/*
          sudo docker system prune -af

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Instalar repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo cp ~/bin/repo /usr/local/bin/repo

      - name: Configurar Git
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Actions Bot"

      - name: Comprobar espacio en disco ANTES de repo init
        run: |
          echo "=== ESPACIO EN DISCO ANTES DE DESCARGAR EL CÓDIGO ==="
          df -h
          echo "=== MEMORIA RAM DISPONIBLE ==="
          free -h

      - name: Sincronizar LineageOS (Modo ultra ligero)
        run: |
          mkdir -p ~/android/lineage
          cd ~/android/lineage
          # Profundidad 1 y sin clones extra
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --quiet

      - name: Clonar repositorios de pettyl
        run: |
          cd ~/android/lineage
          git clone https://github.com/elmendezz/android_device_motorola_pettyl-rom -b lineage-17.1 device/motorola/pettyl
          git clone https://github.com/elmendezz/vendor_pettyl -b lineage-17.1 vendor/motorola/pettyl

      - name: TRUCO: Eliminar .repo para liberar espacio vital
        run: |
          echo "Eliminando la carpeta .repo para liberar unos ~30GB de espacio..."
          rm -rf ~/android/lineage/.repo
          echo "=== ESPACIO EN DISCO DESPUÉS DE BORRAR .REPO ==="
          df -h

      - name: Compilar LineageOS
        run: |
          cd ~/android/lineage
          # Desactivar ccache estrictamente para no gastar disco extra
          export USE_CCACHE=0
          export CCACHE_DISABLE=1
          
          source build/envsetup.sh
          lunch lineage_pettyl-userdebug
          
          # mka bacon genera el ZIP flasheable
          mka bacon -j$(nproc --all)

      - name: Subir ROM
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-17.1-pettyl-Build
          path: ~/android/lineage/out/target/product/pettyl/lineage-*.zip
          retention-days: 7
