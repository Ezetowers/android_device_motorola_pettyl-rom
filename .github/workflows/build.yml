# Version: 4.1
# Changelog:
# - Corrección de sintaxis en booleanos de GitHub Actions (agregadas comillas simples).
# - Corrección de rutas absolutas en upload-artifact (cambio de ~ a /home/runner).
# - Eliminación de comentarios inline en bloques 'with' para evitar problemas de parseo YAML.

name: Build LineageOS 17.1 for pettyl

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar ROM
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del repositorio actual
        uses: actions/checkout@v4

      - name: Limpieza BRUTAL de espacio en disco (Estilo Linux Void)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: 'true'
          android: 'true'
          dotnet: 'true'
          haskell: 'true'
          large-packages: 'true'
          docker-images: 'true'
          swap-storage: 'false'

      - name: Purgar paquetes innecesarios manualmente
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d/*
          sudo docker system prune -af

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Instalar repo
        run: |
          mkdir -p /home/runner/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > /home/runner/bin/repo
          chmod a+x /home/runner/bin/repo
          sudo cp /home/runner/bin/repo /usr/local/bin/repo

      - name: Configurar Git
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Actions Bot"

      - name: Comprobar espacio en disco ANTES de repo init
        run: |
          echo "=== ESPACIO EN DISCO ANTES DE DESCARGAR EL CÓDIGO ==="
          df -h
          echo "=== MEMORIA RAM DISPONIBLE ==="
          free -h

      - name: Sincronizar LineageOS (Modo ultra ligero)
        run: |
          mkdir -p /home/runner/android/lineage
          cd /home/runner/android/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --quiet

      - name: Clonar repositorios de pettyl
        run: |
          cd /home/runner/android/lineage
          git clone https://github.com/elmendezz/android_device_motorola_pettyl-rom -b lineage-17.1 device/motorola/pettyl
          git clone https://github.com/elmendezz/vendor_pettyl -b lineage-17.1 vendor/motorola/pettyl

      - name: TRUCO: Eliminar .repo para liberar espacio vital
        run: |
          echo "Eliminando la carpeta .repo para recuperar espacio..."
          rm -rf /home/runner/android/lineage/.repo
          echo "=== ESPACIO EN DISCO DESPUÉS DE BORRAR .REPO ==="
          df -h

      - name: Compilar LineageOS
        run: |
          cd /home/runner/android/lineage
          export USE_CCACHE=0
          export CCACHE_DISABLE=1
          
          source build/envsetup.sh
          lunch lineage_pettyl-userdebug
          
          mka bacon -j$(nproc --all)

      - name: Subir ROM
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-17.1-pettyl-Build
          path: '/home/runner/android/lineage/out/target/product/pettyl/lineage-*.zip'
          retention-days: '7'
